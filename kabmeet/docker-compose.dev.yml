# Kabmeet — Local Development Infrastructure Dependencies
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kabmeet
      POSTGRES_USER: kabmeet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kabmeet_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - kabmeet_dev_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kabmeetminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kabmeet_minio_dev}
    ports:
      - "9000:9000"
      - "9001:9001"

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"

volumes:
  kabmeet_dev_pg:
